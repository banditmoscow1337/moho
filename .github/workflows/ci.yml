name: Test moho

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.2'
          cache: true
      - run: test -z "$(git ls-files '*.go' | xargs gofmt -l)"
      - run: CGO_ENABLED=0 go test -tags safem_test_noaudio ./...
      - run: CGO_ENABLED=0 go test -race -tags safem_test_noaudio ./...
      - run: CGO_ENABLED=0 go test -tags safem_test_noaudio -run '^$' -fuzz '^FuzzJitterBuffer$' -fuzztime 5s -parallel 2 .
      - run: CGO_ENABLED=0 go test ./...
      - run: CGO_ENABLED=0 go vet ./...
      - run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/moho-${os}-${arch}.test" .
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/opus-${os}-${arch}.test" ./opuscodec
          done
